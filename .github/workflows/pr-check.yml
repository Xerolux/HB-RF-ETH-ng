name: Pull Request Checks

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

jobs:
  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
          requireScope: false
        continue-on-error: true
      - name: Check for version bump
        run: |
          git fetch origin ${{ github.base_ref }}
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:version.txt)
          PR_VERSION=$(cat version.txt)
          echo "Base version: $BASE_VERSION"
          echo "PR version: $PR_VERSION"
          if [ "$BASE_VERSION" = "$PR_VERSION" ]; then
            echo "⚠️ Warning: Version number not updated"
            exit 1
          fi
        continue-on-error: true
      - name: Check file sizes
        run: |
          find . -type f -size +1M -not -path "./.git/*" -not -path "./build/*" -not -path "./webui/node_modules/*" | while read file; do
            echo "⚠️ Large file detected: $file ($(du -h "$file" | cut -f1))"
          done

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json
      - name: Install WebUI dependencies
        run: |
          cd webui
          npm install
      - name: Lint WebUI sources
        run: |
          cd webui
          npm run lint
      - name: Check WebUI build
        run: |
          cd webui
          npm run build
      - name: Validate translations and German fallback
        run: node scripts/check-translations.mjs
      - name: Check for console.log statements
        run: |
          cd webui
          if grep -r "console\.log" --include="*.js" --include="*.vue" .; then
            echo "⚠️ Warning: console.log statements found in code"
          fi
        continue-on-error: true
      - name: Validate JSON files
        run: |
          for file in $(find . -name "*.json" -not -path "./node_modules/*" -not -path "./build/*" -not -path "./webui/node_modules/*"); do
            echo "Validating $file"
            python3 -m json.tool "$file" > /dev/null || exit 1
          done

  cpp-format:
    name: C++ Format (changed lines)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
      - name: Check formatting of lines this PR touches
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "Comparing against merge base $BASE"
          # git-clang-format reformats only the lines the diff actually
          # touches. The firmware sources predate any formatter and are
          # stylistically mixed, so a whole-file check would fail on files a
          # PR merely brushes against. This is a ratchet, not a sweep.
          DIFF=$(git clang-format --diff --extensions c,cpp,h,hpp "$BASE" -- main include)
          if [ -z "$DIFF" ] || \
             [ "$DIFF" = "no modified files to format" ] || \
             [ "$DIFF" = "clang-format did not modify any files" ]; then
            echo "✅ Changed C++ lines are correctly formatted."
            exit 0
          fi
          echo "❌ Changed C++ lines do not match .clang-format:"
          echo "$DIFF"
          echo ""
          echo "Fix locally with: git clang-format $BASE -- main include"
          exit 1

  webui-e2e:
    name: WebUI End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json
      - name: Install WebUI dependencies
        run: |
          cd webui
          npm install
      - name: Install Playwright browser
        run: |
          cd webui
          npx playwright install --with-deps chromium
      - name: Run Playwright regression suite
        run: |
          cd webui
          npm run test:e2e -- tests/regressions.spec.js
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: webui/playwright-report/
          retention-days: 7

  size-check:
    name: Firmware Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json
      - name: Build WebUI
        run: |
          cd webui
          npm install
          npm run build
      - name: Rename WebUI files
        run: python3 rename_webui_files.py
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Setup ESP-IDF v6.1-beta1
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 --branch v6.1-beta1 https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          git -C "$HOME/esp-idf" submodule update --init --recursive --depth 1
          "$HOME/esp-idf/install.sh" esp32
      - name: Build and check firmware size
        run: |
          . "$HOME/esp-idf/export.sh"
          export IDF_TARGET=esp32
          export SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.hb-rf-eth-ng"
          idf.py build
      - name: Report firmware size
        run: |
          . "$HOME/esp-idf/export.sh"
          export IDF_TARGET=esp32
          export SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.hb-rf-eth-ng"
          echo "### Firmware Size Report" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          idf.py size >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      - name: Check WebUI size
        run: |
          echo "### WebUI Size Report" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          du -h webui/dist/*.gz >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
