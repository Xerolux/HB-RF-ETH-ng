name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to deploy (defaults to the head of the dispatched ref)'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # release.yml passes the manifest commit explicitly: a dispatch on
          # "main" issued right after a push can still resolve to the previous
          # head, which once published a stale update manifest.
          ref: ${{ inputs.sha || github.sha }}

      - name: Check web flasher JavaScript syntax
        run: |
          awk '/^<\/script>/{show=0} show; /^<script type="module">/{show=1}' docs/flash/index.html > "$RUNNER_TEMP/flasher.mjs"
          test -s "$RUNNER_TEMP/flasher.mjs"
          node --check "$RUNNER_TEMP/flasher.mjs"

      - name: Prepare web flasher release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub release assets cannot be fetched cross-origin from a browser
          # (the download redirects carry no CORS headers), so the web flasher
          # needs same-origin copies. Mirror the flash files of the most
          # recent releases onto the Pages site on every deploy.
          set -eu
          mkdir -p docs/flash/releases
          : > entries.jsonl
          recent_tags="$(gh release list --limit 8 --json tagName --jq '.[].tagName')"
          stable_tag="$(gh release view --json tagName --jq .tagName)"
          for tag in $(printf '%s\n' "$recent_tags" "$stable_tag" | awk '!seen[$0]++'); do
            meta="$(gh release view "$tag" --json isPrerelease,publishedAt,assets)"
            if [ "$(echo "$meta" | jq '[.assets[] | select(.name == "bootloader.bin" or .name == "partitions.bin" or .name == "SHA256SUMS.txt" or (.name | startswith("firmware_")))] | length')" -lt 4 ]; then
              continue
            fi
            dir="docs/flash/releases/$tag"
            mkdir -p "$dir"
            gh release download "$tag" \
              -p 'bootloader.bin' -p 'partitions.bin' -p 'SHA256SUMS.txt' -p 'firmware_*.bin' \
              -D "$dir" || { rm -rf "$dir"; continue; }
            firmware="$(cd "$dir" && ls firmware_*.bin | head -1)"
            fw_sha="$(awk -v f="$firmware" '$2 == f || $2 == "*"f {print $1}' "$dir/SHA256SUMS.txt")"
            jq -n \
              --arg tag "$tag" \
              --arg date "$(echo "$meta" | jq -r .publishedAt)" \
              --argjson prerelease "$(echo "$meta" | jq .isPrerelease)" \
              --arg firmware "releases/$tag/$firmware" \
              --arg bootloader "releases/$tag/bootloader.bin" \
              --arg partitions "releases/$tag/partitions.bin" \
              --arg sums "releases/$tag/SHA256SUMS.txt" \
              --arg sha "$fw_sha" \
              --argjson fwsize "$(stat -c%s "$dir/$firmware")" \
              '{tag: $tag, date: $date, prerelease: $prerelease,
                files: {firmware: $firmware, bootloader: $bootloader,
                        partitions: $partitions, sha256sums: $sums},
                firmwareSha256: $sha, firmwareSize: $fwsize}' >> entries.jsonl
          done
          jq -s '.' entries.jsonl > docs/flash/releases/index.json
          jq 'length' docs/flash/releases/index.json | xargs -I{} echo "web flasher: {} release(s) mirrored"
          jq -e --arg tag "$stable_tag" 'any(.[]; .tag == $tag and .prerelease == false)' docs/flash/releases/index.json >/dev/null

      - name: Prepare same-origin flash library
        run: |
          set -eu
          archive="$(npm pack esptool-js@0.7.0 --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent)"
          tar -xOf "$RUNNER_TEMP/$archive" package/bundle.js > docs/flash/esptool.bundle.js
          tar -xOf "$RUNNER_TEMP/$archive" package/LICENSE > docs/flash/esptool.LICENSE
          test -s docs/flash/esptool.bundle.js

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: './docs'

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in {1..10}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT_NAME" \
              --jq '.artifacts | any(.expired | not)' | grep -qx true; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::The uploaded Pages artifact is still missing from the Actions API"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
